<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OrderFlow Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0f172a;
    --bg2:       #1e293b;
    --bg3:       #263248;
    --border:    #334155;
    --border2:   #1e3a5f;
    --accent:    #38bdf8;
    --accent2:   #818cf8;
    --green:     #34d399;
    --yellow:    #fbbf24;
    --red:       #f87171;
    --cyan:      #67e8f9;
    --text:      #e2e8f0;
    --text2:     #94a3b8;
    --text3:     #64748b;
    --sidebar-w: 230px;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    overflow: hidden;
  }

  /* ── LAYOUT ─────────────────────────── */
  .app { display: flex; height: 100vh; }

  /* ── SIDEBAR ─────────────────────────── */
  .sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: #0b1120;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    z-index: 10;
  }
  .sidebar-logo {
    padding: 22px 20px 18px;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0;
    background: #0b1120;
    z-index: 1;
  }
  .sidebar-logo h1 {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.02em;
    color: var(--accent);
    line-height: 1.2;
  }
  .sidebar-logo span {
    font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--text3);
    letter-spacing: 0.08em;
    display: block;
    margin-top: 4px;
  }
  .sidebar-nav { padding: 10px 0 20px; flex: 1; }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 16px 9px 20px;
    cursor: pointer;
    transition: all 0.15s ease;
    border-left: 2px solid transparent;
    color: var(--text3);
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.01em;
    user-select: none;
  }
  .nav-item:hover { background: rgba(56,189,248,0.05); color: var(--text2); }
  .nav-item.active {
    background: rgba(56,189,248,0.08);
    border-left-color: var(--accent);
    color: var(--accent);
  }
  .nav-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text3);
    width: 22px;
    flex-shrink: 0;
  }
  .nav-item.active .nav-num { color: var(--accent); opacity: 0.7; }

  /* ── MAIN CONTENT ─────────────────────── */
  .main {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    padding: 32px 36px 28px;
    gap: 24px;
    min-width: 0;
  }

  /* ── SCENARIO HEADER ─────────────────── */
  .scenario-header {}
  .scenario-header h2 {
    font-size: 26px;
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  .scenario-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    padding: 4px 10px;
    background: rgba(56,189,248,0.1);
    border: 1px solid rgba(56,189,248,0.2);
    border-radius: 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.05em;
  }

  /* ── ORDER CARD ──────────────────────── */
  .order-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .order-fields {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  .order-field label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text3);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .order-field .val {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
  }
  .order-field .val.mono {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
  }

  .btn-row {
    display: flex;
    gap: 12px;
    margin-top: 4px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    border-radius: 8px;
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s ease;
    border: 1px solid transparent;
    letter-spacing: 0.02em;
  }
  .btn-run {
    background: var(--accent);
    color: #0b1120;
    border-color: var(--accent);
  }
  .btn-run:hover { background: #7dd3fc; transform: translateY(-1px); box-shadow: 0 4px 20px rgba(56,189,248,0.3); }
  .btn-run:active { transform: translateY(0); }
  .btn-run.running { background: var(--bg3); color: var(--accent); border-color: var(--accent); animation: pulse 1s infinite; }

  .btn-reset {
    background: transparent;
    color: var(--text2);
    border-color: var(--border);
  }
  .btn-reset:hover { background: var(--bg3); color: var(--text); border-color: var(--text3); }

  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.6 } }

  /* ── PIPELINE ────────────────────────── */
  .pipeline-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 24px;
  }
  .pipeline-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text3);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .pipeline {
    display: flex;
    align-items: center;
    gap: 0;
    flex-wrap: wrap;
    gap: 6px 0;
  }
  .pipe-node {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .pipe-box {
    padding: 6px 14px;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    font-weight: 600;
    border: 1px solid var(--border);
    background: var(--bg3);
    color: var(--text2);
    transition: all 0.25s ease;
    position: relative;
    white-space: nowrap;
  }
  .pipe-box.active {
    background: rgba(56,189,248,0.12);
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 12px rgba(56,189,248,0.2);
  }
  .pipe-box.done {
    background: rgba(52,211,153,0.1);
    border-color: var(--green);
    color: var(--green);
  }
  .pipe-box.error {
    background: rgba(248,113,113,0.1);
    border-color: var(--red);
    color: var(--red);
  }
  .pipe-arrow {
    color: var(--text3);
    font-size: 14px;
    padding: 0 4px;
    flex-shrink: 0;
  }

  /* ── STATS ───────────────────────────── */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }
  .stat-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    transition: border-color 0.3s;
  }
  .stat-card.highlight { border-color: var(--accent); }
  .stat-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text3);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .stat-value {
    font-size: 28px;
    font-weight: 800;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    transition: color 0.3s;
  }
  .stat-card.highlight .stat-value { color: var(--accent); }
  .stat-sub {
    font-size: 11px;
    color: var(--text3);
    margin-top: 3px;
  }

  /* ── LOGS ────────────────────────────── */
  .logs-card {
    background: #080e1a;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    flex: 1;
    min-height: 200px;
    display: flex;
    flex-direction: column;
  }
  .logs-header {
    padding: 10px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    background: #0b1120;
    flex-shrink: 0;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot-r { background: #f87171; }
  .dot-y { background: #fbbf24; }
  .dot-g { background: #34d399; }
  .logs-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text3);
    margin-left: 4px;
    letter-spacing: 0.05em;
  }
  .logs-body {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 14px 18px;
    overflow-y: auto;
    flex: 1;
    line-height: 1.7;
    min-height: 180px;
    max-height: 280px;
  }
  .log-line { display: flex; gap: 10px; align-items: flex-start; }
  .log-time { color: var(--text3); flex-shrink: 0; font-size: 11px; margin-top: 1px; }
  .log-sym { flex-shrink: 0; }
  .log-label { font-weight: 600; flex-shrink: 0; min-width: 110px; }
  .log-msg { color: var(--text2); }

  .log-ok .log-sym, .log-ok .log-label { color: var(--green); }
  .log-warn .log-sym, .log-warn .log-label { color: var(--yellow); }
  .log-err .log-sym, .log-err .log-label { color: var(--red); }
  .log-info .log-sym, .log-info .log-label { color: var(--accent); }
  .log-dim .log-sym, .log-dim .log-label { color: var(--text3); }

  /* ── SCENARIO INFO ROW ───────────────── */
  .desc-box {
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 13px;
    color: var(--text2);
    line-height: 1.6;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .desc-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }

  /* ── SCROLLBAR ───────────────────────── */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

  /* ── FADE ANIMATION ──────────────────── */
  @keyframes fadeIn { from { opacity:0; transform:translateY(6px) } to { opacity:1; transform:none } }
  .log-line { animation: fadeIn 0.2s ease both; }
</style>
</head>
<body>
<div class="app">

  <!-- ── SIDEBAR ─────────────────────── -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <h1>OrderFlow<br>Simulator</h1>
      <span>DISTRIBUTED SYSTEMS</span>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>

  <!-- ── MAIN ──────────────────────────── -->
  <main class="main" id="mainContent">
    <!-- injected by JS -->
  </main>
</div>

<script>
// ─────────────────────────────────────────────
// SCENARIO DEFINITIONS
// ─────────────────────────────────────────────
const SCENARIOS = [
  {
    id: 1, name: "Normal Order",
    concept: "Basic distributed processing",
    realLife: "A user places an order and everything works correctly.",
    user: "alice", items: "Burger, Fries", amount: "₹250",
    steps: runNormal,
  },
  {
    id: 2, name: "VIP Order",
    concept: "Event ordering and priority scheduling",
    realLife: "A premium user's order is bumped to HIGH priority, processed before normal orders.",
    user: "bob_vip", items: "Biryani", amount: "₹600",
    steps: runVIP,
  },
  {
    id: 3, name: "Duplicate Order",
    concept: "Idempotency — same request processed only once",
    realLife: "User clicks 'Place Order' twice due to network lag. Duplicate is silently rejected.",
    user: "carol", items: "Tea", amount: "₹30",
    steps: runDuplicate,
  },
  {
    id: 4, name: "Invalid Input",
    concept: "Fail-fast validation",
    realLife: "User submits an empty order or missing details. Rejected immediately.",
    user: "— (empty)", items: "— (none)", amount: "₹100",
    steps: runInvalid,
  },
  {
    id: 5, name: "Rate Limiting",
    concept: "Throttling / Rate limiting",
    realLife: "A user (or bot) fires too many requests. System blocks excess traffic.",
    user: "spammer", items: "Coffee", amount: "₹50 × 5",
    steps: runRateLimit,
  },
  {
    id: 6, name: "Saga Compensation",
    concept: "Distributed transactions — Saga pattern",
    realLife: "Payment OK, Inventory OK, but Restaurant fails → system rolls back both.",
    user: "eve", items: "Pasta", amount: "₹400",
    steps: runSaga,
  },
  {
    id: 7, name: "Broker Failure",
    concept: "Fault tolerance — Circuit Breaker + Retry",
    realLife: "The central broker crashes. System retries with backoff, then opens circuit.",
    user: "dave", items: "Sandwich", amount: "₹120",
    steps: runBrokerFailure,
  },
  {
    id: 8, name: "Dead Letter Queue",
    concept: "Reliability and failure handling",
    realLife: "An order fails repeatedly and is moved to DLQ for safe storage.",
    user: "frank", items: "Sushi", amount: "₹800",
    steps: runDLQ,
  },
  {
    id: 9, name: "Event Replay",
    concept: "Recovery and replay after failure",
    realLife: "After system recovery, DLQ orders are replayed and processed.",
    user: "frank", items: "Sushi (replay)", amount: "₹800",
    steps: runReplay,
  },
  {
    id: 10, name: "Dispatch (Fan-out)",
    concept: "Fan-out — one event → multiple services",
    realLife: "A single order event fans out to Payment, Kitchen, and Dispatch simultaneously.",
    user: "grace", items: "Pizza, Coke", amount: "₹550",
    steps: runDispatch,
  },
  {
    id: 11, name: "Graceful Shutdown",
    concept: "Reliable shutdown — drain queue before exit",
    realLife: "System is shutting down; all pending orders are flushed safely first.",
    user: "system", items: "Pending orders", amount: "—",
    steps: runShutdown,
  },
  {
    id: 12, name: "System Summary",
    concept: "Consistency check — no duplicates, no missing orders",
    realLife: "End-of-run audit: totals for accepted orders, DLQ, saga transactions.",
    user: "—", items: "All orders", amount: "—",
    steps: runSummary,
  },
];

// ─────────────────────────────────────────────
// SIMULATOR STATE
// ─────────────────────────────────────────────
let state = resetState();

function resetState() {
  return {
    accepted: 0,
    processed: 0,
    dlq: 0,
    saga: 0,
    pipelineState: {}, // node→"active"|"done"|"error"
  };
}

// ─────────────────────────────────────────────
// PIPELINE NODES
// ─────────────────────────────────────────────
const PIPELINE_NODES = ["User","OrderService","Broker","Payment","Inventory","Restaurant","Dispatch"];

// ─────────────────────────────────────────────
// UI HELPERS
// ─────────────────────────────────────────────
let currentScenario = 0;
let running = false;

function renderSidebar() {
  const nav = document.getElementById('sidebarNav');
  nav.innerHTML = SCENARIOS.map((s, i) => `
    <div class="nav-item ${i === currentScenario ? 'active' : ''}" onclick="selectScenario(${i})">
      <span class="nav-num">${String(s.id).padStart(2,'0')}</span>
      <span>${s.name}</span>
    </div>
  `).join('');
}

function renderMain() {
  const s = SCENARIOS[currentScenario];
  document.getElementById('mainContent').innerHTML = `
    <div class="scenario-header">
      <h2>${s.id}. ${s.name}</h2>
      <div class="scenario-tag">⬡ Concept: ${s.concept}</div>
    </div>

    <div class="desc-box">
      <span class="desc-icon">💡</span>
      <span>${s.realLife}</span>
    </div>

    <div class="order-card">
      <div class="order-fields">
        <div class="order-field">
          <label>User ID</label>
          <div class="val mono">${s.user}</div>
        </div>
        <div class="order-field">
          <label>Items</label>
          <div class="val">${s.items}</div>
        </div>
        <div class="order-field">
          <label>Amount</label>
          <div class="val">${s.amount}</div>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-run" id="btnRun" onclick="runScenario()">▶ Run Scenario</button>
        <button class="btn btn-reset" onclick="doReset()">↻ Reset System</button>
      </div>
    </div>

    <div class="pipeline-card">
      <div class="pipeline-label">Event Pipeline</div>
      <div class="pipeline" id="pipeline">
        ${PIPELINE_NODES.map((n,i) => `
          <div class="pipe-node">
            <div class="pipe-box" id="pipe-${n}">${n}</div>
            ${i < PIPELINE_NODES.length-1 ? '<span class="pipe-arrow">→</span>' : ''}
          </div>
        `).join('')}
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-card" id="stat-accepted">
        <div class="stat-label">Orders Accepted</div>
        <div class="stat-value" id="sv-accepted">0</div>
        <div class="stat-sub">total enqueued</div>
      </div>
      <div class="stat-card" id="stat-processed">
        <div class="stat-label">Processed</div>
        <div class="stat-value" id="sv-processed">0</div>
        <div class="stat-sub">fully dispatched</div>
      </div>
      <div class="stat-card" id="stat-dlq">
        <div class="stat-label">In DLQ</div>
        <div class="stat-value" id="sv-dlq">0</div>
        <div class="stat-sub">parked failures</div>
      </div>
      <div class="stat-card" id="stat-saga">
        <div class="stat-label">Saga Transactions</div>
        <div class="stat-value" id="sv-saga">0</div>
        <div class="stat-sub">tracked steps</div>
      </div>
    </div>

    <div class="logs-card">
      <div class="logs-header">
        <div class="dot dot-r"></div>
        <div class="dot dot-y"></div>
        <div class="dot dot-g"></div>
        <span class="logs-title">system.log — real-time output</span>
      </div>
      <div class="logs-body" id="logsBody">
        <div class="log-line log-dim">
          <span class="log-time">${ts()}</span>
          <span class="log-sym">·</span>
          <span class="log-label">System</span>
          <span class="log-msg">Ready. Press ▶ Run Scenario to begin.</span>
        </div>
      </div>
    </div>
  `;
  syncStats();
}

function selectScenario(i) {
  if (running) return;
  currentScenario = i;
  renderSidebar();
  renderMain();
}

function ts() {
  return new Date().toLocaleTimeString('en-GB', {hour12:false});
}

function addLog(type, label, msg, delay=0) {
  return new Promise(res => setTimeout(() => {
    const body = document.getElementById('logsBody');
    if (!body) { res(); return; }
    const symMap = { ok:'✔', warn:'⚠', err:'✘', info:'→', dim:'·' };
    const div = document.createElement('div');
    div.className = `log-line log-${type}`;
    div.innerHTML = `
      <span class="log-time">${ts()}</span>
      <span class="log-sym">${symMap[type]||'·'}</span>
      <span class="log-label">${label}</span>
      <span class="log-msg">${msg}</span>
    `;
    body.appendChild(div);
    body.scrollTop = body.scrollHeight;
    res();
  }, delay));
}

function clearLogs() {
  const body = document.getElementById('logsBody');
  if (body) body.innerHTML = '';
}

function setPipe(nodes, cls) {
  nodes.forEach(n => {
    const el = document.getElementById('pipe-'+n);
    if (el) {
      el.className = 'pipe-box';
      if (cls) el.classList.add(cls);
    }
  });
}

function resetPipes() {
  PIPELINE_NODES.forEach(n => setPipe([n], ''));
}

function syncStats() {
  ['accepted','processed','dlq','saga'].forEach(k => {
    const el = document.getElementById('sv-'+k);
    if (el) el.textContent = state[k];
  });
}

function flashStat(key) {
  const card = document.getElementById('stat-'+key);
  if (!card) return;
  card.classList.add('highlight');
  setTimeout(() => card.classList.remove('highlight'), 1000);
}

function incStat(key, by=1) {
  state[key] += by;
  syncStats();
  flashStat(key);
}

async function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

async function animatePipeline(nodes, cls, gap=350) {
  for (const n of nodes) {
    setPipe([n], 'active');
    await wait(gap);
    setPipe([n], cls||'done');
  }
}

// ─────────────────────────────────────────────
// SCENARIO RUNNERS
// ─────────────────────────────────────────────

async function runNormal() {
  resetPipes();
  await addLog('info','System','Starting Normal Order scenario…');
  await addLog('info','User','alice places order: Burger, Fries — ₹250', 200);
  await animatePipeline(['User','OrderService'], 'done', 400);
  await addLog('ok','OrderService','Order validated ✔', 100);
  await addLog('ok','Broker','Event enqueued (priority=NORMAL)', 200);
  setPipe(['Broker'], 'done');
  incStat('accepted');
  await wait(300);
  await addLog('ok','Saga','Transaction started', 100);
  incStat('saga');
  await animatePipeline(['Payment'], 'done', 500);
  await addLog('ok','Payment','Charged ₹250 ✔', 100);
  await animatePipeline(['Inventory'], 'done', 400);
  await addLog('ok','Inventory','Items reserved ✔', 100);
  await animatePipeline(['Restaurant'], 'done', 400);
  await addLog('ok','Restaurant','Kitchen notified ✔', 100);
  await animatePipeline(['Dispatch'], 'done', 400);
  await addLog('ok','Dispatch','Rider assigned ✔', 100);
  incStat('processed');
  await addLog('ok','OrderService','Order complete 🎉', 200);
}

async function runVIP() {
  resetPipes();
  await addLog('info','System','Starting VIP Order scenario…');
  await addLog('info','User','bob_vip places VIP order: Biryani — ₹600', 200);
  await animatePipeline(['User','OrderService'], 'done', 400);
  await addLog('ok','OrderService','VIP flag detected — priority → HIGH', 200);
  await addLog('ok','Broker','VIP event enqueued (priority=HIGH) ⭐', 200);
  setPipe(['Broker'], 'active');
  await wait(300);
  setPipe(['Broker'], 'done');
  incStat('accepted');
  incStat('saga');
  await addLog('info','Broker','VIP order dequeued BEFORE normal orders', 200);
  await animatePipeline(['Payment','Inventory','Restaurant','Dispatch'], 'done', 400);
  ['Payment','Inventory','Restaurant','Dispatch'].forEach(async s => {
    await addLog('ok', s, 'Processed (VIP fast-track) ✔', 100);
  });
  incStat('processed');
  await addLog('ok','OrderService','VIP order complete — delivered with priority ⭐', 300);
}

async function runDuplicate() {
  resetPipes();
  await addLog('info','System','Starting Duplicate Order scenario…');
  await addLog('info','User','carol clicks Place Order…', 200);
  await animatePipeline(['User','OrderService'], 'done', 400);
  await addLog('ok','Broker','Order #fixed-id-001 enqueued', 200);
  setPipe(['Broker'], 'done');
  incStat('accepted');
  await wait(400);
  await addLog('info','User','carol clicks Place Order AGAIN (network lag)…', 200);
  setPipe(['User'], 'active');
  await wait(300);
  setPipe(['User'], 'done');
  await addLog('warn','Broker','Duplicate order_id detected → #fixed-id-001', 200);
  await addLog('warn','Broker','Duplicate IGNORED — idempotency guard active ✔', 200);
  await addLog('ok','System','Only 1 order processed — no double charge 🔒', 300);
  incStat('processed');
}

async function runInvalid() {
  resetPipes();
  await addLog('info','System','Starting Invalid Input scenario…');
  await addLog('warn','User','Submits order with empty user_id and no items', 200);
  setPipe(['User'], 'active');
  await wait(400);
  setPipe(['User'], 'error');
  setPipe(['OrderService'], 'active');
  await wait(400);
  setPipe(['OrderService'], 'error');
  await addLog('err','Validation','user_id is required — rejecting ✘', 200);
  await addLog('err','Validation','items list is empty — rejecting ✘', 200);
  await addLog('warn','OrderService','Request rejected immediately (fail-fast) ⚡', 200);
  await addLog('info','System','No event published — broker untouched', 200);
}

async function runRateLimit() {
  resetPipes();
  await addLog('info','System','Rate Limit scenario — 5 requests, cap = 3');
  for (let i = 1; i <= 5; i++) {
    await wait(250);
    if (i <= 3) {
      setPipe(['User','OrderService'], 'active');
      await wait(200);
      setPipe(['User','OrderService'], 'done');
      await addLog('ok','RateLimiter',`Request ${i}/5 — ALLOWED ✔`, 50);
      incStat('accepted');
    } else {
      setPipe(['User'], 'active');
      await wait(200);
      setPipe(['User'], 'error');
      await addLog('warn','RateLimiter',`Request ${i}/5 — BLOCKED (limit exceeded) ✘`, 50);
    }
  }
  await addLog('info','System','Throttling protected the system from overload 🛡', 300);
}

async function runSaga() {
  resetPipes();
  await addLog('info','System','Saga Compensation scenario…');
  await animatePipeline(['User','OrderService','Broker'], 'done', 400);
  await addLog('ok','Saga','Transaction started for order #manual-xyz', 200);
  incStat('saga');
  incStat('accepted');
  setPipe(['Payment'], 'active');
  await wait(500);
  setPipe(['Payment'], 'done');
  await addLog('ok','Saga',"Step 'payment' completed — ₹400 charged ✔", 200);
  setPipe(['Inventory'], 'active');
  await wait(500);
  setPipe(['Inventory'], 'done');
  await addLog('ok','Saga',"Step 'inventory' completed — items reserved ✔", 200);
  setPipe(['Restaurant'], 'active');
  await wait(500);
  setPipe(['Restaurant'], 'error');
  await addLog('err','Restaurant','Kitchen system UNAVAILABLE — step failed ✘', 200);
  await wait(300);
  await addLog('err','Saga','Failure detected → triggering ROLLBACK', 200);
  await addLog('warn','Saga','Refunding ₹400 payment…', 200);
  setPipe(['Payment'], 'error');
  await wait(300);
  await addLog('warn','Saga','Releasing reserved inventory…', 200);
  setPipe(['Inventory'], 'error');
  await wait(300);
  await addLog('ok','Saga','Rollback complete — system consistent 🔄', 200);
}

async function runBrokerFailure() {
  resetPipes();
  await addLog('info','System','Broker Failure + Circuit Breaker scenario…');
  await animatePipeline(['User','OrderService'], 'done', 400);
  await addLog('warn','Broker','CONNECTION ERROR — broker unreachable ✘', 200);
  setPipe(['Broker'], 'error');
  for (let a = 1; a <= 3; a++) {
    await wait(400);
    const delay = Math.pow(2, a-1);
    await addLog('warn','Publisher',`Attempt ${a}/3 failed — retrying in ${delay}s (backoff)`, 100);
    setPipe(['Broker'], 'error');
  }
  await addLog('err','CircuitBreaker','Opened after 3 failures — calls BLOCKED 🔴', 300);
  await addLog('err','Publisher','Max retries exhausted — routing to DLQ', 200);
  incStat('dlq');
  await addLog('dim','System','Circuit will reset after recovery', 200);
}

async function runDLQ() {
  resetPipes();
  await addLog('info','System','Dead Letter Queue scenario…');
  await animatePipeline(['User','OrderService','Broker'], 'done', 400);
  await addLog('warn','Broker','Order repeatedly fails processing…', 200);
  for (let i = 1; i <= 3; i++) {
    await wait(350);
    await addLog('err','Consumer',`Processing attempt ${i} failed ✘`, 100);
  }
  await addLog('err','DLQ','Order parked in Dead Letter Queue after exhausted retries', 300);
  incStat('dlq');
  await addLog('info','DLQ','Order safely stored for later inspection / replay', 200);
}

async function runReplay() {
  resetPipes();
  await addLog('info','System','Event Replay from DLQ…');
  await addLog('ok','CircuitBreaker','Circuit RESET — system recovered ✅', 200);
  await wait(300);
  await addLog('info','Replay','Found 1 order in DLQ — re-publishing…', 200);
  setPipe(['Broker'], 'active');
  await wait(400);
  setPipe(['Broker'], 'done');
  await addLog('ok','Broker','DLQ order re-enqueued successfully', 200);
  await animatePipeline(['Payment','Inventory','Restaurant','Dispatch'], 'done', 400);
  await addLog('ok','System','Replayed order processed successfully 🔁', 200);
  state.dlq = Math.max(0, state.dlq - 1);
  syncStats();
  incStat('processed');
}

async function runDispatch() {
  resetPipes();
  await addLog('info','System','Fan-out Dispatch scenario…');
  await animatePipeline(['User','OrderService','Broker'], 'done', 400);
  await addLog('ok','Broker','Single order event received', 200);
  await addLog('info','Broker','Fan-out → dispatching to ALL consumers simultaneously', 200);
  incStat('accepted');
  // Animate all 4 at once
  ['Payment','Inventory','Restaurant','Dispatch'].forEach(n => setPipe([n], 'active'));
  await wait(600);
  await Promise.all([
    addLog('ok','Payment','Processing in parallel ✔', 0),
    addLog('ok','Inventory','Processing in parallel ✔', 80),
    addLog('ok','Restaurant','Processing in parallel ✔', 160),
    addLog('ok','Dispatch','Processing in parallel ✔', 240),
  ]);
  ['Payment','Inventory','Restaurant','Dispatch'].forEach(n => setPipe([n], 'done'));
  incStat('processed');
  await addLog('ok','System','All 4 services notified from 1 event 📡', 300);
}

async function runShutdown() {
  resetPipes();
  await addLog('info','System','Graceful Shutdown initiated…');
  await addLog('warn','System','Checking for pending orders in queue…', 300);
  await wait(400);
  const hasPending = state.accepted > state.processed;
  if (hasPending) {
    await addLog('warn','Shutdown','Pending orders detected — draining queue…', 200);
    await animatePipeline(PIPELINE_NODES, 'done', 300);
    await addLog('ok','Shutdown','All pending orders flushed ✔', 200);
    state.processed = state.accepted;
    syncStats();
  } else {
    await addLog('ok','Shutdown','Queue is empty — safe to shut down ✔', 200);
  }
  await addLog('ok','System','System shutdown complete 🔒', 300);
}

async function runSummary() {
  resetPipes();
  await addLog('info','System','Running System Summary / Consistency Check…');
  await wait(400);
  await addLog('ok','Processed',`${state.accepted} unique order(s) accepted`, 200);
  await addLog('info','DLQ',`${state.dlq} order(s) in dead letter queue`, 200);
  await addLog('info','Saga',`${state.saga} transaction(s) tracked`, 200);
  await addLog('ok','Consistency','No duplicates detected ✔', 200);
  await addLog('ok','Consistency','All saga states resolved ✔', 200);
  const healthy = state.dlq === 0;
  if (healthy) {
    await addLog('ok','System','All systems nominal — consistency verified ✅', 300);
  } else {
    await addLog('warn','System',`${state.dlq} order(s) remain in DLQ — review required ⚠`, 300);
  }
  PIPELINE_NODES.forEach(n => setPipe([n], 'done'));
}

// ─────────────────────────────────────────────
// RUN / RESET
// ─────────────────────────────────────────────
async function runScenario() {
  if (running) return;
  running = true;
  const btn = document.getElementById('btnRun');
  if (btn) { btn.classList.add('running'); btn.textContent = '⏳ Running…'; }
  clearLogs();
  resetPipes();

  const s = SCENARIOS[currentScenario];
  try { await s.steps(); } catch(e) { await addLog('err','Error', e.message); }

  running = false;
  if (btn) { btn.classList.remove('running'); btn.textContent = '▶ Run Scenario'; }
}

function doReset() {
  if (running) return;
  state = resetState();
  renderMain();
  addLog('dim','System','System reset. All stats cleared.');
}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
renderSidebar();
renderMain();
</script>
